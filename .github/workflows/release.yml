name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  NFPM_VERSION: '2.47.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        env:
          NFPM_SHA256: '0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783'
        run: |
          # This job holds the signing key, so the tarball is pinned by digest:
          # a release asset can be replaced by its owner after the tag exists.
          curl -sSfL -o nfpm.tgz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tgz" | sha256sum -c -
          tar xzf nfpm.tgz nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Stage signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$GPG_PRIVATE_KEY" > "$RUNNER_TEMP/signing-key.asc"
          [ -s "$RUNNER_TEMP/signing-key.asc" ] || { echo "GPG_PRIVATE_KEY is empty"; exit 1; }

      - name: Build packages
        env:
          GPG_KEY_FILE: ${{ runner.temp }}/signing-key.asc
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          NFPM_RPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # nfpm's default filenames are load-bearing: dpkg-scanpackages --arch
          # matches *_all.deb, so renaming an asset empties every index.
          mkdir -p dist
          export VERSION="${GITHUB_REF_NAME#v}"
          nfpm package -f nfpm.yaml -p deb -t dist/
          nfpm package -f nfpm.yaml -p rpm -t dist/
          ls -l dist/

      - name: Verify package contents
        run: |
          deb=$(ls dist/*.deb)
          dpkg-deb -c "$deb" | grep -q usr/bin/claude-unattended-update
          dpkg-deb -c "$deb" | grep -q usr/lib/systemd/user/claude-unattended-update.timer

      - name: Verify the rpm is signed in its header
        run: |
          # Read the signature out of the header rather than asking rpm to
          # verify it: `rpm --import` needs an initialised rpm database, which
          # a Debian-family runner does not have, and it fails silently.
          rpm -qpi --nosignature dist/*.rpm | sed -n 's/^Signature *: */Signature: /p'
          sig=$(rpm -qp --nosignature --qf '%{RSAHEADER:pgpsig}|%{SIGPGP:pgpsig}' dist/*.rpm)
          echo "header tags: $sig"
          # An unsigned package reports (none) for both. Without this gate a
          # silently unsigned rpm ships and fails every install under gpgcheck=1.
          case "$sig" in
            '(none)|(none)') echo "FATAL: rpm header is not signed"; exit 1 ;;
          esac

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag like v0.2.0-rc1 must not land in the stable suite; the
          # repository builder filters on the release's prerelease flag.
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm \
            --generate-notes $pre
