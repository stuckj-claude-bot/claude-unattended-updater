name: Lint

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -S warning bin/claude-unattended-update install.sh \
            scripts/build-package-repos.sh tests/repair-scenarios.sh

  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin repair scenarios
        run: tests/repair-scenarios.sh
